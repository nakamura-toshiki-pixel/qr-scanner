<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR承認カメラ</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background-color: #f4f6f9;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #333;
  }
  .container {
    max-width: 400px;
    width: 100%;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    box-sizing: border-box;
    text-align: center;
  }
  #reader {
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #e2e8f0;
    margin-top: 15px;
  }
  #status {
    margin-top: 15px;
    padding: 12px;
    border-radius: 6px;
    font-weight: bold;
    color: #b91c1c;
  }
</style>
</head>
<body>

<div class="container">
  <h2>QRコードをかざしてください</h2>
  <div id="reader"></div>
  <div id="status"></div>
</div>

<script>
  let html5Qrcode = null;

  // 画面が開いたら即座にカメラを起動する
  window.addEventListener('DOMContentLoaded', () => {
    startCamera();
  });

  function startCamera() {
    if (html5Qrcode) return;
    html5Qrcode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };
    
    // まず前面カメラを試み、ダメなら背面カメラを起動
    html5Qrcode.start({ facingMode: "user" }, config, onScanSuccess)
      .catch(err => {
        console.log("前面カメラ失敗、背面カメラを試みます:", err);
        html5Qrcode.start({ facingMode: "environment" }, config, onScanSuccess)
          .catch(e => {
            document.getElementById('status').innerText = "カメラの起動に失敗しました。ブラウザのカメラ権限を許可してください。";
          });
      });
  }

  // スキャン成功時
  function onScanSuccess(decodedText) {
    if (html5Qrcode) {
      // カメラを停止してから親画面にデータを送る
      html5Qrcode.stop().then(() => {
        html5Qrcode = null;
        document.getElementById('reader').style.display = 'none';
        sendDataToParent(decodedText);
      }).catch(err => {
        sendDataToParent(decodedText);
      });
    } else {
      sendDataToParent(decodedText);
    }
  }

  // 親ウィンドウ（GASのチェックシート画面）へデータを送る処理
  function sendDataToParent(qrText) {
    const urlParams = new URLSearchParams(window.location.search);
    const targetCellId = urlParams.get('target'); // GASから渡された「cell_8_10」などの住所

    if (window.opener) {
      // 親画面にメッセージ送信
      window.opener.postMessage({
        type: 'QR_SUCCESS',
        target: targetCellId,
        qrData: qrText
      }, "*");
      
      // 送信完了後、このポップアップ（カメラ画面）を自動で閉じる
      window.close();
    } else {
      document.getElementById('status').innerText = "エラー：元の画面が見つかりません。チェックシートの画面から再度やり直してください。";
    }
  }
</script>

</body>
</html>
